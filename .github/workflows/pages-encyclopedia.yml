name: Deploy Encyclopedia Reader Pilot to Pages

on:
  push:
    branches: [main]
    paths:
      - "src/research/encyclopedia*.ts"
      - "site/**"
      - ".github/workflows/pages-encyclopedia.yml"
      - "package.json"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-encyclopedia"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed tree
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provide frozen compiler and deterministic bundler
        run: npm install --no-save --ignore-scripts typescript@5.8.3 esbuild@0.25.10

      - name: Run deterministic regression suite
        run: npm test

      - name: Compile browser shell
        run: npm run build:browser

      - name: Bundle CH1.2 Neptune/Vulcan pilot
        run: npx esbuild src/research/encyclopediaPilot.ts --bundle --platform=browser --format=iife --target=es2020 --outfile=site/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
