<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSP Life Navigation Pilot</title>
<meta name="description" content="Low-stakes student pilot for FSP situated life navigation.">
<style>
:root{--ink:#182033;--muted:#687284;--line:#dce1ea;--paper:#fff;--wash:#f7f8fb;--accent:#263f72;--soft:#e9eef8;--good:#1d6b42;--warn:#8a5a00}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}.app{max-width:1080px;margin:auto;padding:0 20px 80px}.mast{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:1rem;align-items:center}.brand{font-weight:800}.toolbar{display:flex;gap:.5rem;flex-wrap:wrap}.toolbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.55rem .85rem;cursor:pointer}.toolbar .primary{background:var(--accent);color:#fff;border-color:var(--accent)}.hero{padding:46px 0 24px;max-width:860px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted);font-weight:700}.hero h1{font:700 clamp(2.2rem,5vw,4.5rem)/1.05 Georgia,serif;margin:.2em 0}.lede{font-size:1.15rem;color:#344055}.notice{background:var(--soft);border-radius:14px;padding:1rem 1.1rem}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin:1rem 0 2rem}.step{padding:.8rem;border:1px solid var(--line);border-radius:12px;background:var(--wash);text-align:center;font-weight:700}.section{padding:28px 0;border-top:1px solid var(--line)}.section h2{font:700 2rem/1.15 Georgia,serif;margin:.2rem 0 1rem}.section h3{margin-top:1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}.card{border:1px solid var(--line);border-radius:16px;padding:1rem;background:#fff}.field{display:block;margin:.85rem 0}.field span{display:block;font-weight:700;margin-bottom:.3rem}.field small{display:block;color:var(--muted);margin:.2rem 0 .35rem}.field input,.field textarea,.field select{width:100%;border:1px solid #bcc5d3;border-radius:9px;padding:.65rem;background:#fff}.field textarea{min-height:88px;resize:vertical}.future{border-left:4px solid var(--accent)}.firewall{border-left:4px solid var(--warn);padding:.8rem 1rem;background:#fff9ea}.optional{background:var(--wash);padding-left:16px;padding-right:16px}.output{border:2px solid var(--accent);border-radius:18px;padding:1.2rem}.status{display:inline-block;border-radius:999px;padding:.28rem .7rem;font-weight:700}.pass{background:#e7f4ec;color:var(--good)}.hold{background:#fff3d8;color:var(--warn)}.review-card{border:1px solid var(--line);border-radius:12px;padding:.8rem}.muted{color:var(--muted)}.hidden{display:none}.footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted)}pre{white-space:pre-wrap;background:var(--wash);padding:1rem;border-radius:12px}
@media(max-width:760px){.steps{grid-template-columns:1fr}.mast{position:static;display:block}.toolbar{margin-top:.7rem}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function(){
"use strict";
var KEY="fsp-life-navigation-pilot-v1";
var review=false;
function blank(){return {
area:"",good:"",blocked:"",evidence:"",guess:"",broad:"",bounded:"",
future:"",futureCapability:"",futureRoutine:"",futurePeople:"",futureInstitution:"",futureCost:"",futureWorth:"",
futureA:"",futureB:"",futureC:"",compare:"",
dim1:"",change1:"",dim2:"",change2:"",dim3:"",change3:"",reframe:"",
transition:"",step1:"",step2:"",step3:"",gain:"",loss:"",open:"",close:"",
milestone:"",milestoneEvidence:"",ceiling:"",reopen:"",
assumption:"",assumptionType:"",warrant:"",assumptionTest:"",assumptionReopen:"",
affected:"",affectedEffect:"",affectedKnow:"",affectedInfer:"",affectedConsent:"",
advice:"",adviceSource:"",adviceProblem:"",adviceAssumptions:"",adviceContext:"",adviceUseful:"",adviceTooStrong:"",adviceFail:"",
ritual:"",ritualTransition:"",ritualFrequency:"",ritualEvidence:"",ritualExplanation:"",ritualStop:"",
matters:"",awe:"",availability:"",notWorth:"",
weeklyDid:"",weeklyChanged:"",weeklyNot:"",weeklyAssumption:"",weeklyCapability:"",weeklyBurden:"",weeklyStill:"",weeklyReopen:"",weeklyNext:"",
outFuture:"",outTransition:"",outEvidence:"",outRemainder:"",outAction:""
}}
function demo(){var r=blank();r.area="Preparing for a statistics course";r.good="I attend class and complete most assignments.";r.blocked="I avoid practice problems when I am unsure how to begin.";r.evidence="I do better when I practice with worked examples first.";r.guess="I may be treating confusion as evidence that I am bad at math.";r.broad="I am bad at math.";r.bounded="My current preparation and practice routine have not yet produced reliable confidence on unfamiliar problems.";r.future="Three years from now I can use statistics confidently in a research or work setting.";r.futureCapability="I can choose an analysis, use software, and explain the limits of the result.";r.futureRoutine="Short practice sessions are routine rather than crisis-driven.";r.futureCost="Regular practice time and giving up some last-minute study habits.";r.futureWorth="It would open research and career options I care about.";r.futureA="I continue passing courses but avoid quantitative work when I can.";r.futureB="I build statistics competence and use it in later coursework.";r.futureC="I pursue research through a path that uses less quantitative work.";r.dim1="Habits";r.change1="Practice before I feel fully ready.";r.dim2="Skills";r.change2="Build algebra and problem-setup fluency.";r.dim3="Self-map / identity";r.change3="Replace 'bad at math' with a bounded skill diagnosis.";r.reframe="The main bottleneck may be practice structure and prerequisite fluency rather than fixed inability.";r.transition="Complete one week of structured practice and solve a representative set of prerequisite problems.";r.step1="Take a diagnostic set.";r.step2="Practice 20 minutes on four days.";r.step3="Use office hours on one unresolved problem.";r.milestone="Prerequisite fluency improved";r.milestoneEvidence="At least 8/10 representative problems solved without hints";r.ceiling="Supports readiness for the next topic, not mastery of statistics";r.reopen="If the same errors repeat for two weeks";r.assumption="Short frequent practice will work better for me than cramming";r.assumptionType="empirical / self-interpretive";r.warrant="Past assignments improved when I practiced earlier";r.assumptionTest="Try it for two weeks and compare accuracy and stress";r.assumptionReopen="No improvement or unsustainable burden";r.outFuture=r.future;r.outTransition=r.transition;r.outEvidence=r.milestoneEvidence;r.outRemainder="I do not yet know whether the routine is sustainable during busy weeks.";r.outAction="Schedule the first four 20-minute practice blocks.";return r}
var record=blank();try{var x=localStorage.getItem(KEY);if(x)record=JSON.parse(x)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(record))}catch(e){}}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function inp(key,label,help,rows){rows=rows||3;return '<label class="field"><span>'+esc(label)+'</span>'+(help?'<small>'+esc(help)+'</small>':'')+(rows===1?'<input data-k="'+key+'" value="'+esc(record[key])+'">':'<textarea data-k="'+key+'" rows="'+rows+'">'+esc(record[key])+'</textarea>')+'</label>'}
function select(key,label){var opts=["","Lived condition","Habits","Skills","Knowledge","Self-map / identity","Relationships","Institutions","Resources","Opportunity structure","Values / matters","Beauty / awe"];return '<label class="field"><span>'+label+'</span><select data-k="'+key+'">'+opts.map(function(o){return '<option'+(record[key]===o?' selected':'')+'>'+esc(o||"—")+'</option>'}).join("")+'</select></label>'}
function ready(){var f=[];if(!record.area.trim())f.push("Choose an area to examine.");if(!record.future.trim())f.push("Describe one future under examination.");if(!record.transition.trim())f.push("Name one next transition.");if(!record.milestoneEvidence.trim())f.push("Add evidence for at least one milestone.");if(!record.outRemainder.trim())f.push("Keep at least one unresolved remainder visible.");if(!record.outAction.trim())f.push("Choose one reversible next action.");return f}
function summary(){return ["FSP LIFE NAVIGATION — CURRENT MAP","","HERE",record.area||"(not entered)","","THERE",record.outFuture||record.future||"(not entered)","","BRIDGE",record.outTransition||record.transition||"(not entered)","","TEST",record.outEvidence||record.milestoneEvidence||"(not entered)","","REMAINDER",record.outRemainder||"(not entered)","","NEXT REVERSIBLE ACTION",record.outAction||"(not entered)","","The student is the author. The plan is a map. The future is revisable."].join("\n")}
function render(){
var f=ready();
var app=document.getElementById("app");
app.innerHTML=
'<header class="mast"><div class="brand">FSP Life Navigation · Pilot</div><div class="toolbar"><button id="mode">'+(review?'Student mode':'Instructor / review mode')+'</button><button id="demo">Load demo</button><button id="reset">Reset</button><button id="copy" class="primary">Copy summary</button></div></header>'+
'<section class="hero"><div class="eyebrow">Low-stakes pilot prototype</div><h1>A future you can examine</h1><p class="lede">This is not a prediction or a life contract. It is a way to inspect one possible future closely enough to see what would have to change, what evidence would count, what assumptions matter, and what should make you revise the path.</p></section>'+
'<div class="notice"><strong>The student is the author.</strong> The plan is a map. The future is revisable. Use a low-stakes, fictionalized, academic, creative, or career example if you prefer. Nothing here requires sensitive personal disclosure.</div>'+
'<div class="steps"><div class="step">HERE</div><div class="step">THERE</div><div class="step">BRIDGE</div><div class="step">TEST</div><div class="step">RETURN</div></div>'+
'<section class="section"><div class="eyebrow">HERE</div><h2>Where am I actually?</h2>'+inp("area","Area under examination","Examples: course, skill, career path, creative project, habit, community role.",1)+inp("good","What is already going well?")+inp("blocked","What feels blocked?")+inp("evidence","What do I have evidence for?")+inp("guess","What am I only guessing?")+'<div class="grid">'+inp("broad","Broad self-judgment","Example: I am bad at math.")+inp("bounded","Bounded version","Rewrite it as a specific, revisable observation.")+'</div><div class="firewall">My current map of myself ≠ myself.</div></section>'+
'<section class="section"><div class="eyebrow">THERE</div><h2>What future am I considering?</h2>'+inp("future","Describe one possible future","About three years out is enough.")+inp("futureCapability","What can Future-You do that Present-You cannot reliably do now?")+inp("futureRoutine","What has become routine?")+inp("futurePeople","Who is part of this life?")+inp("futureInstitution","What institution, credential, organization, or community matters?")+inp("futureCost","What does this future cost?")+inp("futureWorth","Why might this future be worth inhabiting?")+'<div class="firewall">Imagined coherence ≠ future feasibility.</div></section>'+
'<section class="section optional"><div class="eyebrow">Optional decompression</div><h2>Three futures</h2><div class="grid"><div class="card future"><h3>A · Continuation</h3>'+inp("futureA","If no major pattern changes...")+'</div><div class="card future"><h3>B · Chosen transformation</h3>'+inp("futureB","If I seriously pursue the future...")+'</div><div class="card future"><h3>C · Alternative flourishing path</h3>'+inp("futureC","A different future satisfying some of the same matters...")+'</div></div>'+inp("compare","What did comparing the futures reveal?")+'</section>'+
'<section class="section optional"><div class="eyebrow">BRIDGE · diagnostic</div><h2>What actually has to change?</h2><div class="grid"><div class="card">'+select("dim1","Important dimension 1")+inp("change1","What must change?")+'</div><div class="card">'+select("dim2","Important dimension 2")+inp("change2","What must change?")+'</div><div class="card">'+select("dim3","Important dimension 3")+inp("change3","What must change?")+'</div></div>'+inp("reframe","Is the problem you first named still the main problem?")+'</section>'+
'<section class="section"><div class="eyebrow">BRIDGE</div><h2>Name the next meaningful transition</h2>'+inp("transition","Current state → next capability or condition","Keep it smaller than the final life goal.")+'<div class="grid">'+inp("step1","Enabling step 1")+inp("step2","Enabling step 2")+inp("step3","Enabling step 3")+'</div><div class="grid">'+inp("gain","Capability that may increase")+inp("loss","Capability that may decrease")+inp("open","Option that may open")+inp("close","Option that may close")+'</div></section>'+
'<section class="section"><div class="eyebrow">TEST</div><h2>How would I know?</h2>'+inp("milestone","Milestone / target transition")+inp("milestoneEvidence","Evidence that would show it occurred")+inp("ceiling","What would that evidence justify?")+inp("reopen","What would make me reopen the plan?")+'<div class="firewall">Elapsed time ≠ transformation.</div></section>'+
'<section class="section optional"><div class="eyebrow">TEST · decompression</div><h2>Assumption ledger</h2>'+inp("assumption","Material assumption")+inp("assumptionType","Type of assumption","empirical, financial, institutional, interpersonal, normative, self-interpretive, spiritual...",1)+inp("warrant","Current warrant")+inp("assumptionTest","How could I test it?")+inp("assumptionReopen","REOPEN if...")+'</section>'+
'<section class="section optional"><div class="eyebrow">AUTHORIZATION</div><h2>Who else is affected?</h2>'+inp("affected","Person or group")+inp("affectedEffect","How are they affected?")+inp("affectedKnow","What do I actually know?")+inp("affectedInfer","What am I inferring?")+inp("affectedConsent","What requires discussion or consent?")+'<div class="firewall">I want ≠ I may impose.</div></section>'+
'<section class="section optional"><div class="eyebrow">PORTABILITY</div><h2>Test one piece of advice</h2>'+inp("advice","Advice")+inp("adviceSource","Source",null,1)+inp("adviceProblem","What problem is it trying to solve?")+inp("adviceAssumptions","What assumptions does it make?")+inp("adviceContext","What changes in my context?")+inp("adviceUseful","What part may still be useful?")+inp("adviceTooStrong","What claim would be too strong?")+inp("adviceFail","What would show it is failing for me?")+'<div class="firewall">Successful advice elsewhere ≠ warranted prescription here.</div></section>'+
'<section class="section optional"><div class="eyebrow">RETURN · optional</div><h2>Ritualized Return</h2>'+inp("ritual","Repeatable practice")+inp("ritualTransition","What transition is it meant to maintain?")+inp("ritualFrequency","How often?",null,1)+inp("ritualEvidence","What would count as evidence that it helps?")+inp("ritualExplanation","What explanation am I attaching to it?")+inp("ritualStop","What would make me change or stop it?")+'</section>'+
'<section class="section optional"><div class="eyebrow">Optional reflection</div><h2>Beauty / Awe / Matters</h2>'+inp("matters","What matters enough that your future should make room for it?")+inp("awe","What experiences of beauty, wonder, connection, service, understanding, creativity, love, or reverence matter?")+inp("availability","Is the plan making these more available, less available, or different?")+inp("notWorth","What future might be achievable but not worth inhabiting?")+'<div class="firewall">Achievable ≠ worth achieving.</div></section>'+
'<section class="section"><div class="eyebrow">RETURN</div><h2>What is reality telling me now?</h2><div class="grid">'+inp("weeklyDid","What did I actually do?")+inp("weeklyChanged","What changed?")+inp("weeklyNot","What did not change?")+inp("weeklyAssumption","Which assumption became stronger or weaker?")+inp("weeklyCapability","Which capability improved?")+inp("weeklyBurden","What burden increased?")+inp("weeklyStill","Do I still want the future I am pursuing?")+inp("weeklyReopen","What should reopen?")+inp("weeklyNext","What matters next?")+'</div></section>'+
'<section class="section output"><div class="eyebrow">Output card</div><h2>Bounded current map</h2>'+inp("outFuture","Future under examination")+inp("outTransition","Most important next transition")+inp("outEvidence","Best evidence the transition occurred")+inp("outRemainder","Largest unresolved assumption / remainder")+inp("outAction","One reversible next action")+'<div class="status '+(f.length?"hold":"pass")+'">'+(f.length?"NEEDS MORE BEFORE PILOT":"READY FOR LOW-STAKES PILOT REVIEW")+'</div>'+(f.length?'<ul>'+f.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ul>':'')+'</section>'+
(review?'<section class="section"><div class="eyebrow">Instructor / reviewer</div><h2>Pilot review</h2><div class="grid"><div class="review-card"><strong>✓ Self-authorship</strong><p class="muted">Student chooses the area and future.</p></div><div class="review-card"><strong>✓ Privacy choice</strong><p class="muted">Fictionalized, low-stakes, or hypothetical cases are allowed.</p></div><div class="review-card"><strong>✓ Domain authority boundary</strong><p class="muted">No medical, legal, financial, therapeutic, or religious rulings.</p></div><div class="review-card"><strong>'+(record.outAction.trim()?"✓":"○")+' Reversible next action</strong></div><div class="review-card"><strong>'+(record.outRemainder.trim()?"✓":"○")+' Remainder visible</strong></div></div><div class="notice"><strong>Instructor role:</strong> governed inquiry facilitator. Assess reasoning, not ambition, disclosure, career choice, religion, or values.</div><h3>Suggested debrief</h3><p>What did you discover that you had been treating as one problem but was actually several? Which assumption carries the most weight? What would make you reopen the plan?</p><h3>Pilot feedback</h3><p>Ask about clarity, burden, usefulness, discomfort, whether the exercise changed the student’s map, and whether any question felt too personal.</p><h3>Current summary</h3><pre>'+esc(summary())+'</pre></section>':'')+
'<footer class="footer">FSP Life Navigation Prototype 1 · local browser storage only · not classroom-certified</footer>';
Array.from(app.querySelectorAll("[data-k]")).forEach(function(n){n.addEventListener("input",function(){var k=n.getAttribute("data-k");record[k]=n.value;save()});n.addEventListener("change",function(){var k=n.getAttribute("data-k");record[k]=n.value;save()})});
document.getElementById("mode").onclick=function(){review=!review;render()};
document.getElementById("demo").onclick=function(){record=demo();save();render()};
document.getElementById("reset").onclick=function(){if(confirm("Clear this local pilot record?")){record=blank();save();render()}};
document.getElementById("copy").onclick=function(){navigator.clipboard.writeText(summary()).then(function(){alert("Summary copied.")})};
}
render();
})();
</script>
</body>
</html>
