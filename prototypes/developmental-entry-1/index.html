<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FSP VR · Developmental Entry 1</title>
<style>
:root{--ink:#172033;--muted:#6b7588;--line:#d9dfea;--panel:#f7f9fc;--accent:#244b7d;--warn:#8a5b16}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:#fff}.wrap{max-width:1320px;margin:auto;padding:18px}.mast{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.badge{font-size:.78rem;padding:.25rem .6rem;border-radius:999px;background:#fff1d6;color:var(--warn);font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;margin-top:16px}.stage{min-height:740px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at center,#fff 0,#fafbfe 55%,#f3f6fb 100%);position:relative;overflow:hidden}.panel{border:1px solid var(--line);border-radius:18px;padding:16px;max-height:740px;overflow:auto}.toolbar{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:12px}.toolbar button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.45rem .75rem;cursor:pointer}.toolbar button.active{background:var(--accent);color:#fff}.prompt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(76%,680px);text-align:center}.prompt h1{font:500 2.2rem Georgia,serif}.prompt p{font-size:1.05rem}.simple-object{position:absolute;width:90px;height:90px;border-radius:50%;border:2px solid var(--accent);background:#eef4fb;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .35s ease,left .35s ease,top .35s ease}.other{background:#fff4ea;border-color:#9b6a28}.care{background:#f1f7ef;border-color:#3d7455}.signal{position:absolute;width:30px;height:30px;border-radius:50%;background:#ddd;left:50%;top:70%;transform:translate(-50%,-50%)}.evidence-card{background:var(--panel);border-radius:12px;padding:12px;margin:.6rem 0}.evidence-card details{margin-top:.45rem}.firewall{border-left:4px solid var(--warn);padding:.6rem .75rem;background:#fff8ea;margin:.65rem 0}.small{font-size:.84rem;color:var(--muted)}.vocab{display:inline-block;padding:.2rem .45rem;border-radius:999px;background:#edf2f8;margin:.1rem;font-size:.78rem}.hidden{display:none!important}.field-line{position:absolute;height:2px;background:#8d98aa;transform-origin:left center}.culture-node{position:absolute;border:1px solid var(--line);border-radius:999px;padding:.4rem .65rem;background:#fff;font-size:.84rem}.lottery{background:#132033;color:#fff}.lottery .prompt h1,.lottery .prompt p{color:#fff}.lottery .toolbar button{color:#132033}.step-indicator{font-size:.85rem;color:var(--muted)}@media(max-width:980px){.layout{grid-template-columns:1fr}.panel{max-height:none}.stage{min-height:620px}}
</style></head><body><div class="wrap">
<header class="mast"><div><strong>FSP-VR Developmental Entry 1</strong><div class="step-indicator" id="step-indicator">D0 · Pedagogical zero</div></div><span class="badge">NON-DEPLOYED</span></header>
<div class="toolbar"><button id="back">Back</button><button id="next">Continue</button><button id="inspect-evidence">Inspect evidence</button><button id="reset">Reset</button></div>
<div class="layout"><section class="stage" id="stage"></section><aside class="panel" id="panel"></aside></div>
</div><script src="./data.js"></script><script src="./app.js"></script></body></html>
