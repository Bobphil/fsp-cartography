<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FSP VR · Golden Path 1</title>
<style>
:root{--ink:#162033;--muted:#6a7588;--line:#d8deea;--panel:#f7f9fc;--accent:#234b7b;--warm:#8b6118;--good:#2f6b4f;--bad:#8b4545;--spec:#7b5f8d}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--ink);background:#fff}.wrap{max-width:1440px;margin:auto;padding:16px}.mast{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}.badge{background:#fff3d9;color:var(--warm);border-radius:999px;padding:.25rem .6rem;font-size:.78rem;font-weight:800}.toolbar{display:flex;gap:.45rem;flex-wrap:wrap;padding:12px 0}.toolbar button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.45rem .7rem;cursor:pointer}.toolbar button.active{background:var(--accent);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px}.stage{min-height:760px;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#fff 0,#fafbfe 58%,#eef3f9 100%)}.panel{border:1px solid var(--line);border-radius:18px;padding:15px;max-height:760px;overflow:auto}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78%,720px);text-align:center}.center h1{font:500 2rem Georgia,serif}.obj{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);background:#eef4fb;transition:.35s ease;display:grid;place-items:center;font-size:.74rem;text-align:center;padding:6px}.other{border-color:#9b6a28;background:#fff4e9}.care{border-color:var(--good);background:#eef7f1}.block{border-radius:14px;border-color:#6f7889;background:#f0f2f5}.pulse{position:absolute;width:24px;height:24px;border-radius:50%;background:#b6becb;left:50%;bottom:11%;transform:translateX(-50%);animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.trace{position:absolute;height:4px;border-radius:99px;background:#8390a4;opacity:.38}.trace.current{opacity:1;background:var(--accent)}.trace.fail{background:var(--bad)}.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;box-shadow:0 5px 18px rgba(25,45,70,.05)}.evidence-grid{position:absolute;inset:90px 60px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}.claim-line{position:absolute;left:12%;right:12%;top:52%;height:4px;background:var(--accent)}.ceiling{position:absolute;top:26%;bottom:26%;left:63%;width:4px;background:var(--warm)}.spec{position:absolute;left:63%;right:12%;top:52%;height:4px;background:repeating-linear-gradient(90deg,var(--spec) 0 9px,transparent 9px 16px)}.label{position:absolute;font-size:.8rem;color:var(--muted)}.promptbox{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:.65rem 1rem;max-width:70%;box-shadow:0 4px 14px rgba(0,0,0,.06)}.notice{border-left:4px solid var(--accent);padding:.65rem .8rem;background:var(--panel);margin:.6rem 0}.firewall{border-left:4px solid var(--warm);padding:.65rem .8rem;background:#fff8e9;margin:.6rem 0}.small{font-size:.84rem;color:var(--muted)}.ops{display:flex;gap:.35rem;flex-wrap:wrap}.ops button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.35rem .55rem;cursor:pointer}.lottery{background:#152236;color:#fff}.lottery .center{color:#fff}.hidden{display:none!important}@media(max-width:1000px){.layout{grid-template-columns:1fr}.panel{max-height:none}.stage{min-height:620px}.evidence-grid{inset:60px 20px;grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<header class="mast"><div><strong>FSP-VR Golden Path 1</strong><div id="stage-label" class="small"></div></div><span class="badge">NON-DEPLOYED</span></header>
<div class="toolbar">
<button id="back">Back</button><button id="next">Continue</button>
<span class="small">Scaffold:</span>
<button data-scaffold="3" class="active">L3</button><button data-scaffold="2">L2</button><button data-scaffold="1">L1</button><button data-scaffold="0">L0</button>
<button id="reset">Reset</button>
</div>
<div class="layout"><section class="stage" id="stage"></section><aside class="panel" id="panel"></aside></div>
</div>
<script src="./data.js"></script><script src="./app.js"></script></body></html>
